<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Library</title>
  <!-- Bootstrap 5.3 CSS only (no JS) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1 class="text-center my-4">Book Library</h1>
    </header>

    <!-- Filter Section -->
    <section class="filter-section mb-4">
      <div class="btn-group" role="group" aria-label="Filter books by status">
        <button type="button" class="btn btn-outline-primary filter-btn active" data-status="all">All</button>
        <button type="button" class="btn btn-outline-primary filter-btn" data-status="read">Read</button>
        <button type="button" class="btn btn-outline-primary filter-btn" data-status="unread">Unread</button>
      </div>
    </section>

    <!-- Add Book Form -->
    <section class="add-book-section mb-4">
      <h2 class="h4 mb-3">Add New Book</h2>
      <form id="add-book-form" class="row g-3">
        <div class="col-md-6">
          <label for="title" class="form-label">Title <span class="text-danger">*</span></label>
          <input type="text" class="form-control" id="title" name="title" required maxlength="200" aria-required="true">
        </div>
        <div class="col-md-6">
          <label for="author" class="form-label">Author <span class="text-danger">*</span></label>
          <input type="text" class="form-control" id="author" name="author" required maxlength="100" aria-required="true">
        </div>
        <div class="col-md-4">
          <label for="isbn" class="form-label">ISBN</label>
          <input type="text" class="form-control" id="isbn" name="isbn" maxlength="20">
        </div>
        <div class="col-md-4">
          <label for="publicationYear" class="form-label">Publication Year</label>
          <input type="number" class="form-control" id="publicationYear" name="publicationYear" min="1000" max="9999" pattern="[0-9]{4}">
        </div>
        <div class="col-md-4">
          <label for="status" class="form-label">Status</label>
          <select class="form-select" id="status" name="status">
            <option value="unread">Unread</option>
            <option value="read">Read</option>
          </select>
        </div>
        <div class="col-12">
          <button type="submit" class="btn btn-primary">Add Book</button>
        </div>
      </form>
      <div id="form-feedback" class="mt-2" role="alert" aria-live="polite"></div>
    </section>

    <!-- Book List Section -->
    <section class="book-list-section">
      <h2 class="h4 mb-3">My Books</h2>
      <div id="book-list" class="row g-3"></div>
    </section>

    <!-- Book Detail Modal -->
    <div id="book-detail-modal" class="modal-overlay" style="display: none;" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-content">
        <div class="modal-header">
          <h3 id="modal-title" class="h5">Book Details</h3>
          <button type="button" class="btn-close" aria-label="Close modal"></button>
        </div>
        <div class="modal-body">
          <form id="edit-book-form">
            <input type="hidden" id="edit-id" name="id">
            <div class="mb-3">
              <label for="edit-title" class="form-label">Title <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="edit-title" name="title" required maxlength="200">
            </div>
            <div class="mb-3">
              <label for="edit-author" class="form-label">Author <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="edit-author" name="author" required maxlength="100">
            </div>
            <div class="mb-3">
              <label for="edit-isbn" class="form-label">ISBN</label>
              <input type="text" class="form-control" id="edit-isbn" name="isbn" maxlength="20">
            </div>
            <div class="mb-3">
              <label for="edit-publicationYear" class="form-label">Publication Year</label>
              <input type="number" class="form-control" id="edit-publicationYear" name="publicationYear" min="1000" max="9999">
            </div>
            <div class="mb-3">
              <label for="edit-status" class="form-label">Status</label>
              <select class="form-select" id="edit-status" name="status">
                <option value="unread">Unread</option>
                <option value="read">Read</option>
              </select>
            </div>
            <div class="mb-3">
              <small class="text-muted">Added: <span id="edit-dateAdded"></span></small>
            </div>
            <div class="d-flex justify-content-between">
              <button type="submit" class="btn btn-primary">Save Changes</button>
              <button type="button" class="btn btn-danger" id="delete-book-btn">Delete Book</button>
            </div>
          </form>
          <div id="modal-feedback" class="mt-2" role="alert" aria-live="polite"></div>
        </div>
      </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast-notification" role="status" aria-live="polite" aria-atomic="true"></div>
  </div>

  <script src="/js/app.js"></script>
  <script src="/js/ui.js"></script>
</body>
</html>
